- id: '1790934203011'
  alias: Living Area
  description: ''
  triggers:
  - trigger: occupancy.detected
    target:
      entity_id: binary_sensor.sonoff_snzb_06p24
    options:
      behavior: each
      for: 00:00:00
    id: generated-7h7d
  - trigger: occupancy.cleared
    target:
      entity_id: binary_sensor.sonoff_snzb_06p24
    options:
      behavior: each
      for: 00:10:00
    id: generated-9yMM
  conditions:
  - condition: illuminance.is_value
    target:
      entity_id: sensor.sonoff_snzb_06p24_illuminance
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 15
  - condition: switch.is_off
    target:
      entity_id: input_boolean.mia_visiting
    options:
      behavior: any
      for: 00:00:00
  - condition: template
    value_template: '{{ is_state(''sun.sun'', ''below_horizon'') }}'
  actions:
  - if:
    - condition: trigger
      id:
      - generated-7h7d
    then:
    - if:
      - condition: time
        after: '18:00:00'
        before: '22:00:00'
      - condition: light.is_off
        target:
          entity_id:
          - light.light
          - light.vintage
        options:
          behavior: any
          for: 00:00:00
      then:
      - action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.light
          - light.vintage
        data:
          brightness_pct: 50
      else:
      - if:
        - condition: time
          after: '22:00:00'
          before: 07:00:00
        - condition: light.is_off
          target:
            entity_id:
            - light.living_area_wall
            - light.living_area_wall_2
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: light.turn_on
          metadata: {}
          data:
            brightness_pct: 5
          target:
            entity_id:
            - light.living_area_wall_2
            - light.living_area_wall
    else:
    - if:
      - condition: trigger
        id:
        - generated-9yMM
      then:
      - if:
        - condition: time
          after: '18:00:00'
          before: '22:00:00'
        - condition: light.is_on
          target:
            entity_id:
            - light.light
            - light.vintage
          options:
            behavior: any
            for: 00:00:00
        then:
        - action: light.turn_off
          metadata: {}
          target:
            entity_id:
            - light.light
            - light.vintage
          data: {}
        else:
        - if:
          - condition: time
            after: '22:00:00'
            before: 07:00:00
          - condition: light.is_on
            target:
              entity_id:
              - light.living_area_wall
              - light.living_area_wall_2
            options:
              behavior: any
              for: 00:00:00
          then:
          - action: light.turn_off
            metadata: {}
            data: {}
            target:
              entity_id:
              - light.living_area_wall_2
              - light.living_area_wall
  mode: restart
